x-app: &app
  build: .
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-invoices}:${POSTGRES_PASSWORD:-invoices}@db:5432/${POSTGRES_DB:-invoices}
    REDIS_URL: redis://redis:6379/0
    DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string-0123456789}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoices}
      POSTGRES_USER: ${POSTGRES_USER:-invoices}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoices}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoices}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7

  web:
    <<: *app
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker --beat --loglevel=info

volumes:
  pgdata:
